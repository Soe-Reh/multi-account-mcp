name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # macOS is the supported platform. Linux and Windows have known test gaps (timing and file paths) and are not run yet.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
