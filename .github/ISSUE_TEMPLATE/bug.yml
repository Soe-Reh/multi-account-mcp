name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste passwords, app passwords, tokens or private email text.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (npx -y multi-account-mcp --version) or commit
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
  - type: input
    id: tool
    attributes:
      label: AI tool (Claude Desktop, Claude Code, Cursor, other)
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      options: [Gmail app password, Gmail Google sign-in, Yahoo, iCloud, Other IMAP]
